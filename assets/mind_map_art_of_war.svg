<circle cx="1700.0" cy="1200.0" r="210" fill="#7a1f1f" stroke="#c9a227" stroke-width="10"/>
<text x="1700.0" y="1180.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">The Art</text>
<text x="1700.0" y="1245.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">of War</text>
<text x="1700.0" y="1305.0" text-anchor="middle" font-size="34" fill="#f3e3a6">Sun Tzu</text>
<rect x="1500.0" y="196.0" width="400" height="208" rx="18" fill="hsl(0,70%,97%)" stroke="hsl(0,62%,42%)" stroke-width="3"/>
<rect x="1500.0" y="196.0" width="400" height="54" rx="18" fill="hsl(0,62%,42%)"/>
<rect x="1500.0" y="232.0" width="400" height="18" fill="hsl(0,62%,42%)"/>
<text x="1700.0" y="232.0" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1 · Laying Plans</text>
<text x="1518.0" y="284.0" font-size="21" fill="#222" xml:space="preserve">• 5 factors: the Way, Heaven, Earth,</text>
<text x="1518.0" y="314.0" font-size="21" fill="#222" xml:space="preserve">   the Commander, Method</text>
<text x="1518.0" y="344.0" font-size="21" fill="#222" xml:space="preserve">• Compare the forces before fighting</text>
<text x="1518.0" y="374.0" font-size="21" fill="#222" xml:space="preserve">• All warfare is based on deception</text>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="178" rx="18" fill="hsl(27,70%,97%)" stroke="hsl(27,62%,42%)" stroke-width="3"/>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="54" rx="18" fill="hsl(27,62%,42%)"/>
<rect x="2118.081818818212" y="350.08957691211106" width="400" height="18" fill="hsl(27,62%,42%)"/>
<text x="2318.081818818212" y="350.08957691211106" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2 · Waging War</text>
<text x="2136.081818818212" y="402.08957691211106" font-size="21" fill="#222" xml:space="preserve">• A long war exhausts the state</text>
<text x="2136.081818818212" y="432.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Quick victory, not a long campaign</text>
<text x="2136.081818818212" y="462.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Forage on the enemy's land</text>
<rect x="2594.568541638563" y="554.7417279419598" width="400" height="268" rx="18" fill="hsl(55,70%,97%)" stroke="hsl(55,62%,42%)" stroke-width="3"/>
<rect x="2594.568541638563" y="554.7417279419598" width="400" height="54" rx="18" fill="hsl(55,62%,42%)"/>
<rect x="2594.568541638563" y="590.7417279419598" width="400" height="18" fill="hsl(55,62%,42%)"/>
<text x="2794.568541638563" y="590.7417279419598" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3 · Attack by Stratagem</text>
<text x="2612.568541638563" y="642.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Winning without fighting is the</text>
<text x="2612.568541638563" y="672.7417279419598" font-size="21" fill="#222" xml:space="preserve">   ideal</text>
<text x="2612.568541638563" y="702.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Attack the strategy, then the</text>
<text x="2612.568541638563" y="732.7417279419598" font-size="21" fill="#222" xml:space="preserve">   alliances, the army and, last, the</text>
<text x="2612.568541638563" y="762.7417279419598" font-size="21" fill="#222" xml:space="preserve">   cities</text>
<text x="2612.568541638563" y="792.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Know the enemy and know yourself</text>
<rect x="2820.302802550412" y="1002.5169877702094" width="400" height="178" rx="18" fill="hsl(83,70%,97%)" stroke="hsl(83,62%,42%)" stroke-width="3"/>
<rect x="2820.302802550412" y="1002.5169877702094" width="400" height="54" rx="18" fill="hsl(83,62%,42%)"/>
<rect x="2820.302802550412" y="1038.5169877702094" width="400" height="18" fill="hsl(83,62%,42%)"/>
<text x="3020.302802550412" y="1038.5169877702094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">4 · Tactical Dispositions</text>
<text x="2838.302802550412" y="1090.5169877702094" font-size="21" fill="#222" xml:space="preserve">• First make yourself invincible</text>
<text x="2838.302802550412" y="1120.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Wait for the enemy's vulnerability</text>
<text x="2838.302802550412" y="1150.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Win before you fight</text>
<rect x="2743.5716027716016" y="1415.144398338282" width="400" height="208" rx="18" fill="hsl(110,70%,97%)" stroke="hsl(110,62%,42%)" stroke-width="3"/>
<rect x="2743.5716027716016" y="1415.144398338282" width="400" height="54" rx="18" fill="hsl(110,62%,42%)"/>
<rect x="2743.5716027716016" y="1451.144398338282" width="400" height="18" fill="hsl(110,62%,42%)"/>
<text x="2943.5716027716016" y="1451.144398338282" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">5 · Energy</text>
<text x="2761.5716027716016" y="1503.144398338282" font-size="21" fill="#222" xml:space="preserve">• Direct and indirect forces</text>
<text x="2761.5716027716016" y="1533.144398338282" font-size="21" fill="#222" xml:space="preserve">• Endless combinations</text>
<text x="2761.5716027716016" y="1563.144398338282" font-size="21" fill="#222" xml:space="preserve">• Strength of the whole, not the</text>
<text x="2761.5716027716016" y="1593.144398338282" font-size="21" fill="#222" xml:space="preserve">   individual</text>
<rect x="2381.9531354602577" y="1769.659673353991" width="400" height="208" rx="18" fill="hsl(138,70%,97%)" stroke="hsl(138,62%,42%)" stroke-width="3"/>
<rect x="2381.9531354602577" y="1769.659673353991" width="400" height="54" rx="18" fill="hsl(138,62%,42%)"/>
<rect x="2381.9531354602577" y="1805.659673353991" width="400" height="18" fill="hsl(138,62%,42%)"/>
<text x="2581.9531354602577" y="1805.659673353991" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">6 · Weak Points and Strong</text>
<text x="2399.9531354602577" y="1857.659673353991" font-size="21" fill="#222" xml:space="preserve">• Arrive first and impose the ground</text>
<text x="2399.9531354602577" y="1887.659673353991" font-size="21" fill="#222" xml:space="preserve">• Attack where the enemy does not</text>
<text x="2399.9531354602577" y="1917.659673353991" font-size="21" fill="#222" xml:space="preserve">   defend</text>
<text x="2399.9531354602577" y="1947.659673353991" font-size="21" fill="#222" xml:space="preserve">• Adapt like water</text>
<rect x="1818.2898335024515" y="1954.8476356834467" width="400" height="238" rx="18" fill="hsl(166,70%,97%)" stroke="hsl(166,62%,42%)" stroke-width="3"/>
<rect x="1818.2898335024515" y="1954.8476356834467" width="400" height="54" rx="18" fill="hsl(166,62%,42%)"/>
<rect x="1818.2898335024515" y="1990.8476356834467" width="400" height="18" fill="hsl(166,62%,42%)"/>
<text x="2018.2898335024515" y="1990.8476356834467" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">7 · Maneuvering</text>
<text x="1836.2898335024515" y="2042.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Turn the detour into the direct</text>
<text x="1836.2898335024515" y="2072.8476356834467" font-size="21" fill="#222" xml:space="preserve">   route</text>
<text x="1836.2898335024515" y="2102.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Communication: banners and drums</text>
<text x="1836.2898335024515" y="2132.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Do not attack rested or motivated</text>
<text x="1836.2898335024515" y="2162.8476356834467" font-size="21" fill="#222" xml:space="preserve">   troops</text>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="178" rx="18" fill="hsl(193,70%,97%)" stroke="hsl(193,62%,42%)" stroke-width="3"/>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="54" rx="18" fill="hsl(193,62%,42%)"/>
<rect x="1181.7101664975485" y="2020.8476356834472" width="400" height="18" fill="hsl(193,62%,42%)"/>
<text x="1381.7101664975485" y="2020.8476356834472" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">8 · Variation in Tactics</text>
<text x="1199.7101664975485" y="2072.847635683447" font-size="21" fill="#222" xml:space="preserve">• Some orders must not be obeyed</text>
<text x="1199.7101664975485" y="2102.847635683447" font-size="21" fill="#222" xml:space="preserve">• Weigh advantage and risk</text>
<text x="1199.7101664975485" y="2132.847635683447" font-size="21" fill="#222" xml:space="preserve">• 5 fatal faults of the commander</text>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="178" rx="18" fill="hsl(221,70%,97%)" stroke="hsl(221,62%,42%)" stroke-width="3"/>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="54" rx="18" fill="hsl(221,62%,42%)"/>
<rect x="618.0468645397427" y="1820.6596733539911" width="400" height="18" fill="hsl(221,62%,42%)"/>
<text x="818.0468645397427" y="1820.6596733539911" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">9 · The Army on the March</text>
<text x="636.0468645397427" y="1872.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Read the signs of the terrain and</text>
<text x="636.0468645397427" y="1902.6596733539911" font-size="21" fill="#222" xml:space="preserve">   the enemy</text>
<text x="636.0468645397427" y="1932.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Discipline with humanity</text>
<rect x="256.42839722839835" y="1400.1443983382824" width="400" height="238" rx="18" fill="hsl(249,70%,97%)" stroke="hsl(249,62%,42%)" stroke-width="3"/>
<rect x="256.42839722839835" y="1400.1443983382824" width="400" height="54" rx="18" fill="hsl(249,62%,42%)"/>
<rect x="256.42839722839835" y="1436.1443983382824" width="400" height="18" fill="hsl(249,62%,42%)"/>
<text x="456.42839722839835" y="1436.1443983382824" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">10 · Terrain</text>
<text x="274.42839722839835" y="1488.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 kinds of terrain</text>
<text x="274.42839722839835" y="1518.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 causes of defeat that are the</text>
<text x="274.42839722839835" y="1548.1443983382824" font-size="21" fill="#222" xml:space="preserve">   commander's fault</text>
<text x="274.42839722839835" y="1578.1443983382824" font-size="21" fill="#222" xml:space="preserve">• Care for soldiers as your own</text>
<text x="274.42839722839835" y="1608.1443983382824" font-size="21" fill="#222" xml:space="preserve">   children</text>
<rect x="179.6971974495882" y="972.516987770209" width="400" height="238" rx="18" fill="hsl(276,70%,97%)" stroke="hsl(276,62%,42%)" stroke-width="3"/>
<rect x="179.6971974495882" y="972.516987770209" width="400" height="54" rx="18" fill="hsl(276,62%,42%)"/>
<rect x="179.6971974495882" y="1008.516987770209" width="400" height="18" fill="hsl(276,62%,42%)"/>
<text x="379.6971974495882" y="1008.516987770209" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">11 · The Nine Situations</text>
<text x="197.6971974495882" y="1060.516987770209" font-size="21" fill="#222" xml:space="preserve">• From dispersive ground to desperate</text>
<text x="197.6971974495882" y="1090.516987770209" font-size="21" fill="#222" xml:space="preserve">   ground</text>
<text x="197.6971974495882" y="1120.516987770209" font-size="21" fill="#222" xml:space="preserve">• With no way out, troops fight with</text>
<text x="197.6971974495882" y="1150.516987770209" font-size="21" fill="#222" xml:space="preserve">   everything</text>
<text x="197.6971974495882" y="1180.516987770209" font-size="21" fill="#222" xml:space="preserve">• Speed and surprise</text>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="178" rx="18" fill="hsl(304,70%,97%)" stroke="hsl(304,62%,42%)" stroke-width="3"/>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="54" rx="18" fill="hsl(304,62%,42%)"/>
<rect x="405.43145836143617" y="635.7417279419606" width="400" height="18" fill="hsl(304,62%,42%)"/>
<text x="605.4314583614362" y="635.7417279419606" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">12 · The Attack by Fire</text>
<text x="423.43145836143617" y="687.7417279419606" font-size="21" fill="#222" xml:space="preserve">• 5 targets of fire</text>
<text x="423.43145836143617" y="717.7417279419606" font-size="21" fill="#222" xml:space="preserve">• Do not act out of anger</text>
<text x="423.43145836143617" y="747.7417279419606" font-size="21" fill="#222" xml:space="preserve">• Move only if there is an advantage</text>
<rect x="881.918181181788" y="284.08957691211094" width="400" height="238" rx="18" fill="hsl(332,70%,97%)" stroke="hsl(332,62%,42%)" stroke-width="3"/>
<rect x="881.918181181788" y="284.08957691211094" width="400" height="54" rx="18" fill="hsl(332,62%,42%)"/>
<rect x="881.918181181788" y="320.08957691211094" width="400" height="18" fill="hsl(332,62%,42%)"/>
<text x="1081.918181181788" y="320.08957691211094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">13 · The Use of Spies</text>
<text x="899.918181181788" y="372.08957691211094" font-size="21" fill="#222" xml:space="preserve">• Information is worth more than</text>
<text x="899.918181181788" y="402.08957691211094" font-size="21" fill="#222" xml:space="preserve">   battles</text>
<text x="899.918181181788" y="432.08957691211094" font-size="21" fill="#222" xml:space="preserve">• 5 kinds of spies</text>
<text x="899.918181181788" y="462.08957691211094" font-size="21" fill="#222" xml:space="preserve">• The double agent is the most</text>
<text x="899.918181181788" y="492.08957691211094" font-size="21" fill="#222" xml:space="preserve">   valuable</text>
