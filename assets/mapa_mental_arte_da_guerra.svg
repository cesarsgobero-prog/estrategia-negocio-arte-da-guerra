<circle cx="1700.0" cy="1200.0" r="210" fill="#7a1f1f" stroke="#c9a227" stroke-width="10"/>
<text x="1700.0" y="1180.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">A Arte</text>
<text x="1700.0" y="1245.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">da Guerra</text>
<text x="1700.0" y="1305.0" text-anchor="middle" font-size="34" fill="#f3e3a6">Sun Tzu</text>
<rect x="1500.0" y="196.0" width="400" height="208" rx="18" fill="hsl(0,70%,97%)" stroke="hsl(0,62%,42%)" stroke-width="3"/>
<rect x="1500.0" y="196.0" width="400" height="54" rx="18" fill="hsl(0,62%,42%)"/>
<rect x="1500.0" y="232.0" width="400" height="18" fill="hsl(0,62%,42%)"/>
<text x="1700.0" y="232.0" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1 · Planejamento</text>
<text x="1518.0" y="284.0" font-size="21" fill="#222" xml:space="preserve">• 5 fatores: Caminho, Céu, Terra,</text>
<text x="1518.0" y="314.0" font-size="21" fill="#222" xml:space="preserve">   Comandante, Método</text>
<text x="1518.0" y="344.0" font-size="21" fill="#222" xml:space="preserve">• Comparar as forças antes de lutar</text>
<text x="1518.0" y="374.0" font-size="21" fill="#222" xml:space="preserve">• Toda guerra se baseia no engano</text>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="178" rx="18" fill="hsl(27,70%,97%)" stroke="hsl(27,62%,42%)" stroke-width="3"/>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="54" rx="18" fill="hsl(27,62%,42%)"/>
<rect x="2118.081818818212" y="350.08957691211106" width="400" height="18" fill="hsl(27,62%,42%)"/>
<text x="2318.081818818212" y="350.08957691211106" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2 · Fazer a guerra</text>
<text x="2136.081818818212" y="402.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Guerra longa esgota o Estado</text>
<text x="2136.081818818212" y="432.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Vitória rápida, não campanha longa</text>
<text x="2136.081818818212" y="462.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Abastecer-se no território inimigo</text>
<rect x="2594.568541638563" y="569.7417279419598" width="400" height="238" rx="18" fill="hsl(55,70%,97%)" stroke="hsl(55,62%,42%)" stroke-width="3"/>
<rect x="2594.568541638563" y="569.7417279419598" width="400" height="54" rx="18" fill="hsl(55,62%,42%)"/>
<rect x="2594.568541638563" y="605.7417279419598" width="400" height="18" fill="hsl(55,62%,42%)"/>
<text x="2794.568541638563" y="605.7417279419598" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3 · Estratégia ofensiva</text>
<text x="2612.568541638563" y="657.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Vencer sem lutar é o ideal</text>
<text x="2612.568541638563" y="687.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Atacar a estratégia, depois as</text>
<text x="2612.568541638563" y="717.7417279419598" font-size="21" fill="#222" xml:space="preserve">   alianças, o exército e, por último,</text>
<text x="2612.568541638563" y="747.7417279419598" font-size="21" fill="#222" xml:space="preserve">   as cidades</text>
<text x="2612.568541638563" y="777.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Conhecer o inimigo e a si mesmo</text>
<rect x="2820.302802550412" y="1002.5169877702094" width="400" height="178" rx="18" fill="hsl(83,70%,97%)" stroke="hsl(83,62%,42%)" stroke-width="3"/>
<rect x="2820.302802550412" y="1002.5169877702094" width="400" height="54" rx="18" fill="hsl(83,62%,42%)"/>
<rect x="2820.302802550412" y="1038.5169877702094" width="400" height="18" fill="hsl(83,62%,42%)"/>
<text x="3020.302802550412" y="1038.5169877702094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">4 · Disposições</text>
<text x="2838.302802550412" y="1090.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Primeiro tornar-se invencível</text>
<text x="2838.302802550412" y="1120.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Esperar a vulnerabilidade do inimigo</text>
<text x="2838.302802550412" y="1150.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Vencer antes de lutar</text>
<rect x="2743.5716027716016" y="1430.144398338282" width="400" height="178" rx="18" fill="hsl(110,70%,97%)" stroke="hsl(110,62%,42%)" stroke-width="3"/>
<rect x="2743.5716027716016" y="1430.144398338282" width="400" height="54" rx="18" fill="hsl(110,62%,42%)"/>
<rect x="2743.5716027716016" y="1466.144398338282" width="400" height="18" fill="hsl(110,62%,42%)"/>
<text x="2943.5716027716016" y="1466.144398338282" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">5 · Energia</text>
<text x="2761.5716027716016" y="1518.144398338282" font-size="21" fill="#222" xml:space="preserve">• Forças diretas e indiretas</text>
<text x="2761.5716027716016" y="1548.144398338282" font-size="21" fill="#222" xml:space="preserve">• Combinações infinitas</text>
<text x="2761.5716027716016" y="1578.144398338282" font-size="21" fill="#222" xml:space="preserve">• Força do conjunto, não do indivíduo</text>
<rect x="2381.9531354602577" y="1784.659673353991" width="400" height="178" rx="18" fill="hsl(138,70%,97%)" stroke="hsl(138,62%,42%)" stroke-width="3"/>
<rect x="2381.9531354602577" y="1784.659673353991" width="400" height="54" rx="18" fill="hsl(138,62%,42%)"/>
<rect x="2381.9531354602577" y="1820.659673353991" width="400" height="18" fill="hsl(138,62%,42%)"/>
<text x="2581.9531354602577" y="1820.659673353991" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">6 · Pontos fortes e fracos</text>
<text x="2399.9531354602577" y="1872.659673353991" font-size="21" fill="#222" xml:space="preserve">• Chegar primeiro e impor o terreno</text>
<text x="2399.9531354602577" y="1902.659673353991" font-size="21" fill="#222" xml:space="preserve">• Atacar onde o inimigo não defende</text>
<text x="2399.9531354602577" y="1932.659673353991" font-size="21" fill="#222" xml:space="preserve">• Adaptar-se como a água</text>
<rect x="1818.2898335024515" y="1969.8476356834467" width="400" height="208" rx="18" fill="hsl(166,70%,97%)" stroke="hsl(166,62%,42%)" stroke-width="3"/>
<rect x="1818.2898335024515" y="1969.8476356834467" width="400" height="54" rx="18" fill="hsl(166,62%,42%)"/>
<rect x="1818.2898335024515" y="2005.8476356834467" width="400" height="18" fill="hsl(166,62%,42%)"/>
<text x="2018.2898335024515" y="2005.8476356834467" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">7 · Manobras</text>
<text x="1836.2898335024515" y="2057.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Transformar o desvio em atalho</text>
<text x="1836.2898335024515" y="2087.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Comunicação: bandeiras e tambores</text>
<text x="1836.2898335024515" y="2117.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Não atacar tropas descansadas ou</text>
<text x="1836.2898335024515" y="2147.8476356834467" font-size="21" fill="#222" xml:space="preserve">   motivadas</text>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="178" rx="18" fill="hsl(193,70%,97%)" stroke="hsl(193,62%,42%)" stroke-width="3"/>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="54" rx="18" fill="hsl(193,62%,42%)"/>
<rect x="1181.7101664975485" y="2020.8476356834472" width="400" height="18" fill="hsl(193,62%,42%)"/>
<text x="1381.7101664975485" y="2020.8476356834472" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">8 · Variações táticas</text>
<text x="1199.7101664975485" y="2072.847635683447" font-size="21" fill="#222" xml:space="preserve">• Há ordens que não se obedecem</text>
<text x="1199.7101664975485" y="2102.847635683447" font-size="21" fill="#222" xml:space="preserve">• Pesar vantagem e risco</text>
<text x="1199.7101664975485" y="2132.847635683447" font-size="21" fill="#222" xml:space="preserve">• 5 defeitos fatais do comandante</text>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="178" rx="18" fill="hsl(221,70%,97%)" stroke="hsl(221,62%,42%)" stroke-width="3"/>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="54" rx="18" fill="hsl(221,62%,42%)"/>
<rect x="618.0468645397427" y="1820.6596733539911" width="400" height="18" fill="hsl(221,62%,42%)"/>
<text x="818.0468645397427" y="1820.6596733539911" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">9 · O exército em marcha</text>
<text x="636.0468645397427" y="1872.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Ler os sinais do terreno e do</text>
<text x="636.0468645397427" y="1902.6596733539911" font-size="21" fill="#222" xml:space="preserve">   inimigo</text>
<text x="636.0468645397427" y="1932.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Disciplina com humanidade</text>
<rect x="256.42839722839835" y="1415.1443983382824" width="400" height="208" rx="18" fill="hsl(249,70%,97%)" stroke="hsl(249,62%,42%)" stroke-width="3"/>
<rect x="256.42839722839835" y="1415.1443983382824" width="400" height="54" rx="18" fill="hsl(249,62%,42%)"/>
<rect x="256.42839722839835" y="1451.1443983382824" width="400" height="18" fill="hsl(249,62%,42%)"/>
<text x="456.42839722839835" y="1451.1443983382824" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">10 · Terreno</text>
<text x="274.42839722839835" y="1503.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 tipos de terreno</text>
<text x="274.42839722839835" y="1533.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 causas de derrota que são culpa do</text>
<text x="274.42839722839835" y="1563.1443983382824" font-size="21" fill="#222" xml:space="preserve">   comandante</text>
<text x="274.42839722839835" y="1593.1443983382824" font-size="21" fill="#222" xml:space="preserve">• Cuidar dos soldados como filhos</text>
<rect x="179.6971974495882" y="987.516987770209" width="400" height="208" rx="18" fill="hsl(276,70%,97%)" stroke="hsl(276,62%,42%)" stroke-width="3"/>
<rect x="179.6971974495882" y="987.516987770209" width="400" height="54" rx="18" fill="hsl(276,62%,42%)"/>
<rect x="179.6971974495882" y="1023.516987770209" width="400" height="18" fill="hsl(276,62%,42%)"/>
<text x="379.6971974495882" y="1023.516987770209" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">11 · As nove situações</text>
<text x="197.6971974495882" y="1075.516987770209" font-size="21" fill="#222" xml:space="preserve">• Do terreno disperso ao terreno</text>
<text x="197.6971974495882" y="1105.516987770209" font-size="21" fill="#222" xml:space="preserve">   mortal</text>
<text x="197.6971974495882" y="1135.516987770209" font-size="21" fill="#222" xml:space="preserve">• Sem saída, a tropa luta com tudo</text>
<text x="197.6971974495882" y="1165.516987770209" font-size="21" fill="#222" xml:space="preserve">• Velocidade e surpresa</text>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="178" rx="18" fill="hsl(304,70%,97%)" stroke="hsl(304,62%,42%)" stroke-width="3"/>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="54" rx="18" fill="hsl(304,62%,42%)"/>
<rect x="405.43145836143617" y="635.7417279419606" width="400" height="18" fill="hsl(304,62%,42%)"/>
<text x="605.4314583614362" y="635.7417279419606" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">12 · Ataque com fogo</text>
<text x="423.43145836143617" y="687.7417279419606" font-size="21" fill="#222" xml:space="preserve">• 5 alvos do fogo</text>
<text x="423.43145836143617" y="717.7417279419606" font-size="21" fill="#222" xml:space="preserve">• Não agir por raiva</text>
<text x="423.43145836143617" y="747.7417279419606" font-size="21" fill="#222" xml:space="preserve">• Mover-se só se houver vantagem</text>
<rect x="881.918181181788" y="314.08957691211094" width="400" height="178" rx="18" fill="hsl(332,70%,97%)" stroke="hsl(332,62%,42%)" stroke-width="3"/>
<rect x="881.918181181788" y="314.08957691211094" width="400" height="54" rx="18" fill="hsl(332,62%,42%)"/>
<rect x="881.918181181788" y="350.08957691211094" width="400" height="18" fill="hsl(332,62%,42%)"/>
<text x="1081.918181181788" y="350.08957691211094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">13 · Espiões</text>
<text x="899.918181181788" y="402.08957691211094" font-size="21" fill="#222" xml:space="preserve">• Informação vale mais que batalhas</text>
<text x="899.918181181788" y="432.08957691211094" font-size="21" fill="#222" xml:space="preserve">• 5 tipos de espiões</text>
<text x="899.918181181788" y="462.08957691211094" font-size="21" fill="#222" xml:space="preserve">• O agente duplo é o mais valioso</text>
<text x="3370" y="2375" text-anchor="end" font-size="20" fill="#888">Resumo próprio · texto original em domínio público</text>
