<circle cx="1700.0" cy="1200.0" r="210" fill="#7a1f1f" stroke="#c9a227" stroke-width="10"/>
<text x="1700.0" y="1180.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">El Arte</text>
<text x="1700.0" y="1245.0" text-anchor="middle" font-size="58" font-weight="800" fill="#fff">de la Guerra</text>
<text x="1700.0" y="1305.0" text-anchor="middle" font-size="34" fill="#f3e3a6">Sun Tzu</text>
<rect x="1500.0" y="196.0" width="400" height="208" rx="18" fill="hsl(0,70%,97%)" stroke="hsl(0,62%,42%)" stroke-width="3"/>
<rect x="1500.0" y="196.0" width="400" height="54" rx="18" fill="hsl(0,62%,42%)"/>
<rect x="1500.0" y="232.0" width="400" height="18" fill="hsl(0,62%,42%)"/>
<text x="1700.0" y="232.0" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">1 · Planificación</text>
<text x="1518.0" y="284.0" font-size="21" fill="#222" xml:space="preserve">• 5 factores: Camino, Cielo, Tierra,</text>
<text x="1518.0" y="314.0" font-size="21" fill="#222" xml:space="preserve">   Comandante, Método</text>
<text x="1518.0" y="344.0" font-size="21" fill="#222" xml:space="preserve">• Comparar las fuerzas antes de luchar</text>
<text x="1518.0" y="374.0" font-size="21" fill="#222" xml:space="preserve">• Toda guerra se basa en el engaño</text>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="178" rx="18" fill="hsl(27,70%,97%)" stroke="hsl(27,62%,42%)" stroke-width="3"/>
<rect x="2118.081818818212" y="314.08957691211106" width="400" height="54" rx="18" fill="hsl(27,62%,42%)"/>
<rect x="2118.081818818212" y="350.08957691211106" width="400" height="18" fill="hsl(27,62%,42%)"/>
<text x="2318.081818818212" y="350.08957691211106" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">2 · Hacer la guerra</text>
<text x="2136.081818818212" y="402.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Una guerra larga agota al Estado</text>
<text x="2136.081818818212" y="432.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Victoria rápida, no campaña larga</text>
<text x="2136.081818818212" y="462.08957691211106" font-size="21" fill="#222" xml:space="preserve">• Abastecerse en territorio enemigo</text>
<rect x="2594.568541638563" y="569.7417279419598" width="400" height="238" rx="18" fill="hsl(55,70%,97%)" stroke="hsl(55,62%,42%)" stroke-width="3"/>
<rect x="2594.568541638563" y="569.7417279419598" width="400" height="54" rx="18" fill="hsl(55,62%,42%)"/>
<rect x="2594.568541638563" y="605.7417279419598" width="400" height="18" fill="hsl(55,62%,42%)"/>
<text x="2794.568541638563" y="605.7417279419598" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">3 · Estrategia ofensiva</text>
<text x="2612.568541638563" y="657.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Vencer sin luchar es lo ideal</text>
<text x="2612.568541638563" y="687.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Atacar la estrategia, luego las</text>
<text x="2612.568541638563" y="717.7417279419598" font-size="21" fill="#222" xml:space="preserve">   alianzas, el ejército y, por último,</text>
<text x="2612.568541638563" y="747.7417279419598" font-size="21" fill="#222" xml:space="preserve">   las ciudades</text>
<text x="2612.568541638563" y="777.7417279419598" font-size="21" fill="#222" xml:space="preserve">• Conocer al enemigo y a uno mismo</text>
<rect x="2820.302802550412" y="987.5169877702094" width="400" height="208" rx="18" fill="hsl(83,70%,97%)" stroke="hsl(83,62%,42%)" stroke-width="3"/>
<rect x="2820.302802550412" y="987.5169877702094" width="400" height="54" rx="18" fill="hsl(83,62%,42%)"/>
<rect x="2820.302802550412" y="1023.5169877702094" width="400" height="18" fill="hsl(83,62%,42%)"/>
<text x="3020.302802550412" y="1023.5169877702094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">4 · Disposiciones</text>
<text x="2838.302802550412" y="1075.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Primero volverse invencible</text>
<text x="2838.302802550412" y="1105.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Esperar la vulnerabilidad del</text>
<text x="2838.302802550412" y="1135.5169877702094" font-size="21" fill="#222" xml:space="preserve">   enemigo</text>
<text x="2838.302802550412" y="1165.5169877702094" font-size="21" fill="#222" xml:space="preserve">• Vencer antes de luchar</text>
<rect x="2743.5716027716016" y="1415.144398338282" width="400" height="208" rx="18" fill="hsl(110,70%,97%)" stroke="hsl(110,62%,42%)" stroke-width="3"/>
<rect x="2743.5716027716016" y="1415.144398338282" width="400" height="54" rx="18" fill="hsl(110,62%,42%)"/>
<rect x="2743.5716027716016" y="1451.144398338282" width="400" height="18" fill="hsl(110,62%,42%)"/>
<text x="2943.5716027716016" y="1451.144398338282" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">5 · Energía</text>
<text x="2761.5716027716016" y="1503.144398338282" font-size="21" fill="#222" xml:space="preserve">• Fuerzas directas e indirectas</text>
<text x="2761.5716027716016" y="1533.144398338282" font-size="21" fill="#222" xml:space="preserve">• Combinaciones infinitas</text>
<text x="2761.5716027716016" y="1563.144398338282" font-size="21" fill="#222" xml:space="preserve">• Fuerza del conjunto, no del</text>
<text x="2761.5716027716016" y="1593.144398338282" font-size="21" fill="#222" xml:space="preserve">   individuo</text>
<rect x="2381.9531354602577" y="1784.659673353991" width="400" height="178" rx="18" fill="hsl(138,70%,97%)" stroke="hsl(138,62%,42%)" stroke-width="3"/>
<rect x="2381.9531354602577" y="1784.659673353991" width="400" height="54" rx="18" fill="hsl(138,62%,42%)"/>
<rect x="2381.9531354602577" y="1820.659673353991" width="400" height="18" fill="hsl(138,62%,42%)"/>
<text x="2581.9531354602577" y="1820.659673353991" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">6 · Puntos fuertes y débiles</text>
<text x="2399.9531354602577" y="1872.659673353991" font-size="21" fill="#222" xml:space="preserve">• Llegar primero e imponer el terreno</text>
<text x="2399.9531354602577" y="1902.659673353991" font-size="21" fill="#222" xml:space="preserve">• Atacar donde el enemigo no defiende</text>
<text x="2399.9531354602577" y="1932.659673353991" font-size="21" fill="#222" xml:space="preserve">• Adaptarse como el agua</text>
<rect x="1818.2898335024515" y="1969.8476356834467" width="400" height="208" rx="18" fill="hsl(166,70%,97%)" stroke="hsl(166,62%,42%)" stroke-width="3"/>
<rect x="1818.2898335024515" y="1969.8476356834467" width="400" height="54" rx="18" fill="hsl(166,62%,42%)"/>
<rect x="1818.2898335024515" y="2005.8476356834467" width="400" height="18" fill="hsl(166,62%,42%)"/>
<text x="2018.2898335024515" y="2005.8476356834467" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">7 · Maniobras</text>
<text x="1836.2898335024515" y="2057.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Convertir el desvío en atajo</text>
<text x="1836.2898335024515" y="2087.8476356834467" font-size="21" fill="#222" xml:space="preserve">• Comunicación: banderas y tambores</text>
<text x="1836.2898335024515" y="2117.8476356834467" font-size="21" fill="#222" xml:space="preserve">• No atacar tropas descansadas o</text>
<text x="1836.2898335024515" y="2147.8476356834467" font-size="21" fill="#222" xml:space="preserve">   motivadas</text>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="178" rx="18" fill="hsl(193,70%,97%)" stroke="hsl(193,62%,42%)" stroke-width="3"/>
<rect x="1181.7101664975485" y="1984.8476356834472" width="400" height="54" rx="18" fill="hsl(193,62%,42%)"/>
<rect x="1181.7101664975485" y="2020.8476356834472" width="400" height="18" fill="hsl(193,62%,42%)"/>
<text x="1381.7101664975485" y="2020.8476356834472" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">8 · Variaciones tácticas</text>
<text x="1199.7101664975485" y="2072.847635683447" font-size="21" fill="#222" xml:space="preserve">• Hay órdenes que no se obedecen</text>
<text x="1199.7101664975485" y="2102.847635683447" font-size="21" fill="#222" xml:space="preserve">• Sopesar ventaja y riesgo</text>
<text x="1199.7101664975485" y="2132.847635683447" font-size="21" fill="#222" xml:space="preserve">• 5 defectos fatales del comandante</text>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="178" rx="18" fill="hsl(221,70%,97%)" stroke="hsl(221,62%,42%)" stroke-width="3"/>
<rect x="618.0468645397427" y="1784.6596733539911" width="400" height="54" rx="18" fill="hsl(221,62%,42%)"/>
<rect x="618.0468645397427" y="1820.6596733539911" width="400" height="18" fill="hsl(221,62%,42%)"/>
<text x="818.0468645397427" y="1820.6596733539911" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">9 · El ejército en marcha</text>
<text x="636.0468645397427" y="1872.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Leer las señales del terreno y del</text>
<text x="636.0468645397427" y="1902.6596733539911" font-size="21" fill="#222" xml:space="preserve">   enemigo</text>
<text x="636.0468645397427" y="1932.6596733539911" font-size="21" fill="#222" xml:space="preserve">• Disciplina con humanidad</text>
<rect x="256.42839722839835" y="1415.1443983382824" width="400" height="208" rx="18" fill="hsl(249,70%,97%)" stroke="hsl(249,62%,42%)" stroke-width="3"/>
<rect x="256.42839722839835" y="1415.1443983382824" width="400" height="54" rx="18" fill="hsl(249,62%,42%)"/>
<rect x="256.42839722839835" y="1451.1443983382824" width="400" height="18" fill="hsl(249,62%,42%)"/>
<text x="456.42839722839835" y="1451.1443983382824" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">10 · Terreno</text>
<text x="274.42839722839835" y="1503.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 tipos de terreno</text>
<text x="274.42839722839835" y="1533.1443983382824" font-size="21" fill="#222" xml:space="preserve">• 6 causas de derrota atribuibles al</text>
<text x="274.42839722839835" y="1563.1443983382824" font-size="21" fill="#222" xml:space="preserve">   comandante</text>
<text x="274.42839722839835" y="1593.1443983382824" font-size="21" fill="#222" xml:space="preserve">• Cuidar a los soldados como a hijos</text>
<rect x="179.6971974495882" y="987.516987770209" width="400" height="208" rx="18" fill="hsl(276,70%,97%)" stroke="hsl(276,62%,42%)" stroke-width="3"/>
<rect x="179.6971974495882" y="987.516987770209" width="400" height="54" rx="18" fill="hsl(276,62%,42%)"/>
<rect x="179.6971974495882" y="1023.516987770209" width="400" height="18" fill="hsl(276,62%,42%)"/>
<text x="379.6971974495882" y="1023.516987770209" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">11 · Las nueve situaciones</text>
<text x="197.6971974495882" y="1075.516987770209" font-size="21" fill="#222" xml:space="preserve">• Del terreno disperso al terreno</text>
<text x="197.6971974495882" y="1105.516987770209" font-size="21" fill="#222" xml:space="preserve">   mortal</text>
<text x="197.6971974495882" y="1135.516987770209" font-size="21" fill="#222" xml:space="preserve">• Sin salida, la tropa lucha con todo</text>
<text x="197.6971974495882" y="1165.516987770209" font-size="21" fill="#222" xml:space="preserve">• Velocidad y sorpresa</text>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="178" rx="18" fill="hsl(304,70%,97%)" stroke="hsl(304,62%,42%)" stroke-width="3"/>
<rect x="405.43145836143617" y="599.7417279419606" width="400" height="54" rx="18" fill="hsl(304,62%,42%)"/>
<rect x="405.43145836143617" y="635.7417279419606" width="400" height="18" fill="hsl(304,62%,42%)"/>
<text x="605.4314583614362" y="635.7417279419606" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">12 · Ataque con fuego</text>
<text x="423.43145836143617" y="687.7417279419606" font-size="21" fill="#222" xml:space="preserve">• 5 blancos del fuego</text>
<text x="423.43145836143617" y="717.7417279419606" font-size="21" fill="#222" xml:space="preserve">• No actuar por ira</text>
<text x="423.43145836143617" y="747.7417279419606" font-size="21" fill="#222" xml:space="preserve">• Moverse solo si hay ventaja</text>
<rect x="881.918181181788" y="299.08957691211094" width="400" height="208" rx="18" fill="hsl(332,70%,97%)" stroke="hsl(332,62%,42%)" stroke-width="3"/>
<rect x="881.918181181788" y="299.08957691211094" width="400" height="54" rx="18" fill="hsl(332,62%,42%)"/>
<rect x="881.918181181788" y="335.08957691211094" width="400" height="18" fill="hsl(332,62%,42%)"/>
<text x="1081.918181181788" y="335.08957691211094" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">13 · Espías</text>
<text x="899.918181181788" y="387.08957691211094" font-size="21" fill="#222" xml:space="preserve">• La información vale más que las</text>
<text x="899.918181181788" y="417.08957691211094" font-size="21" fill="#222" xml:space="preserve">   batallas</text>
<text x="899.918181181788" y="447.08957691211094" font-size="21" fill="#222" xml:space="preserve">• 5 tipos de espías</text>
<text x="899.918181181788" y="477.08957691211094" font-size="21" fill="#222" xml:space="preserve">• El agente doble es el más valioso</text>
<text x="3370" y="2375" text-anchor="end" font-size="20" fill="#888">Resumen propio · texto original de dominio público</text>
