<text x="178" y="2132" font-size="32" fill="#222" xml:space="preserve">• Llegar primero e imponer el terreno</text>
<text x="178" y="2176" font-size="32" fill="#222" xml:space="preserve">• Atacar donde el enemigo no defiende</text>
<text x="178" y="2220" font-size="32" fill="#222" xml:space="preserve">• Adaptarse como el agua</text>
