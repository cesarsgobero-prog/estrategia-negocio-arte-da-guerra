<rect x="150" y="862" width="890" height="24" fill="hsl(27,62%,42%)"/>
<text x="180" y="858" font-size="40" font-weight="700" fill="#fff">2 · Hacer la guerra</text>
<text x="178" y="936" font-size="32" fill="#222" xml:space="preserve">• Una guerra larga agota al Estado</text>
<text x="178" y="980" font-size="32" fill="#222" xml:space="preserve">• Victoria rápida, no campaña larga</text>
<text x="178" y="1024" font-size="32" fill="#222" xml:space="preserve">• Abastecerse en territorio enemigo</text>
