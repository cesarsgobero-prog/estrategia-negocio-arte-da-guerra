<text x="180" y="526" font-size="40" font-weight="700" fill="#fff">1 · Planificación</text>
<text x="178" y="604" font-size="32" fill="#222" xml:space="preserve">• 5 factores: Camino, Cielo, Tierra, Comandante,</text>
<text x="178" y="648" font-size="32" fill="#222" xml:space="preserve">   Método</text>
<text x="178" y="692" font-size="32" fill="#222" xml:space="preserve">• Comparar las fuerzas antes de luchar</text>
<text x="178" y="736" font-size="32" fill="#222" xml:space="preserve">• Toda guerra se basa en el engaño</text>
