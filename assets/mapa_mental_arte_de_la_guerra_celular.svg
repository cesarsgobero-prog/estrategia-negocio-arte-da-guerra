<text x="180" y="3162" font-size="40" font-weight="700" fill="#fff">10 · Terreno</text>
<text x="178" y="3240" font-size="32" fill="#222" xml:space="preserve">• 6 tipos de terreno</text>
<text x="178" y="3284" font-size="32" fill="#222" xml:space="preserve">• 6 causas de derrota atribuibles al comandante</text>
<text x="178" y="3328" font-size="32" fill="#222" xml:space="preserve">• Cuidar a los soldados como a hijos</text>
