<text x="180" y="3450" font-size="40" font-weight="700" fill="#fff">11 · Las nueve situaciones</text>
<text x="178" y="3528" font-size="32" fill="#222" xml:space="preserve">• Del terreno disperso al terreno mortal</text>
<text x="178" y="3572" font-size="32" fill="#222" xml:space="preserve">• Sin salida, la tropa lucha con todo</text>
<text x="178" y="3616" font-size="32" fill="#222" xml:space="preserve">• Velocidad y sorpresa</text>
