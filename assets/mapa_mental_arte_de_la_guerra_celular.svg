<text x="180" y="3738" font-size="40" font-weight="700" fill="#fff">12 · Ataque con fuego</text>
<text x="178" y="3816" font-size="32" fill="#222" xml:space="preserve">• 5 blancos del fuego</text>
<text x="178" y="3860" font-size="32" fill="#222" xml:space="preserve">• No actuar por ira</text>
<text x="178" y="3904" font-size="32" fill="#222" xml:space="preserve">• Moverse solo si hay ventaja</text>
