<text x="178" y="1556" font-size="32" fill="#222" xml:space="preserve">• Primero volverse invencible</text>
<text x="178" y="1600" font-size="32" fill="#222" xml:space="preserve">• Esperar la vulnerabilidad del enemigo</text>
<text x="178" y="1644" font-size="32" fill="#222" xml:space="preserve">• Vencer antes de luchar</text>
