<rect x="150" y="1150" width="890" height="24" fill="hsl(55,62%,42%)"/>
<text x="180" y="1146" font-size="40" font-weight="700" fill="#fff">3 · Estrategia ofensiva</text>
<text x="178" y="1224" font-size="32" fill="#222" xml:space="preserve">• Vencer sin luchar es lo ideal</text>
<text x="178" y="1268" font-size="32" fill="#222" xml:space="preserve">• Atacar la estrategia, luego las alianzas, el</text>
<text x="178" y="1312" font-size="32" fill="#222" xml:space="preserve">   ejército y, por último, las ciudades</text>
<text x="178" y="1356" font-size="32" fill="#222" xml:space="preserve">• Conocer al enemigo y a uno mismo</text>
